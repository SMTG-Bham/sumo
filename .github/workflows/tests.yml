name: Run tests

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    name: Lint
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pre-commit
        run: |
          python -m pip install --upgrade pip
          python -m pip install pre-commit
      # Runs the same hooks contributors get locally, so the NumPy 2.x
      # cleanliness check (ruff's NPY rules) actually gates a pull request.
      - name: Run hooks
        run: pre-commit run --all-files --show-diff-on-failure

  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    name: Python ${{ matrix.python-version }}

    steps:
      - uses: actions/checkout@v6
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[tests]'

      - name: Test
        run: pytest

  oldest-deps:
    runs-on: ubuntu-latest
    name: Oldest supported numpy/scipy
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml

      # Installs the floors declared in pyproject.toml so the lower bounds are
      # tested rather than merely asserted.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy==2.0.*" "scipy==1.13.*"
          python -m pip install -e '.[tests]'

      - name: Report versions
        run: python -c "import numpy, scipy; print(numpy.__version__, scipy.__version__)"

      - name: Test
        run: pytest
